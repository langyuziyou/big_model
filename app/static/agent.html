<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服工作台</title>
<style>
  :root { --brand:#059669; --bg:#eef2f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Microsoft YaHei",-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:#0f172a; }
  header { background:#111827; color:#fff; padding:14px 22px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:17px; margin:0; }
  .conn { font-size:12px; padding:4px 10px; border-radius:999px; background:#374151; }
  .conn.on { background:var(--brand); }
  .wrap { padding:20px; display:flex; flex-wrap:wrap; gap:18px; }
  .card { width:400px; max-width:96vw; background:#fff; border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,.08);
          display:flex; flex-direction:column; overflow:hidden; }
  .card-head { padding:12px 16px; background:#f8fafc; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; }
  .card-head .name { font-weight:600; }
  .status { font-size:12px; padding:3px 10px; border-radius:999px; background:#e0f2fe; color:#0369a1; }
  .status.offline { background:#fee2e2; color:#b91c1c; }
  .msgs { flex:1; height:300px; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; background:#fafbfc; }
  .m { max-width:82%; padding:8px 12px; border-radius:10px; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .m.customer { align-self:flex-start; background:#fff; border:1px solid #e5e7eb; }
  .m.agent { align-self:flex-end; background:#d1fae5; }
  .m.system { align-self:center; background:#eef2ff; color:#64748b; font-size:12px; padding:4px 10px; border-radius:999px; }
  .offline-tip { padding:10px; text-align:center; color:#b91c1c; font-size:13px; background:#fef2f2; }
  .replybar { display:flex; gap:8px; padding:10px; border-top:1px solid #e5e7eb; }
  .replybar input { flex:1; padding:9px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:13px; outline:none; }
  .replybar button { padding:9px 16px; background:var(--brand); color:#fff; border:0; border-radius:8px; cursor:pointer; }
  .empty { color:#94a3b8; text-align:center; margin-top:80px; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>客服工作台 · <span id="agentName">…</span></h1>
  <span id="conn" class="conn">连接中…</span>
</header>
<div class="wrap" id="wrap">
  <div class="empty">暂无客户接入人工服务。请保持本页面打开，等待客户转人工。</div>
</div>

<script>
const wrap = document.getElementById('wrap');
const conn = document.getElementById('conn');
const sessions = new Map(); // sid -> {el, msgs}
let agentId = '';

function clearEmpty() {
  const e = wrap.querySelector('.empty');
  if (e) e.remove();
}

function addCustomer(m) {
  if (sessions.has(m.session_id)) return;
  const card = buildCard(m);
  sessions.set(m.session_id, card);
  (m.history || []).forEach(h => appendMsg(card, h));
  wrap.appendChild(card.el);
  clearEmpty();
}

function buildCard(m) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="card-head">
      <span class="name"></span>
      <span class="status">服务中</span>
    </div>
    <div class="msgs"></div>
    <div class="replybar">
      <input type="text" placeholder="回复客户…">
      <button>发送</button>
    </div>`;
  el.querySelector('.name').textContent = m.name + '（' + m.session_id + '）';
  const msgs = el.querySelector('.msgs');
  const input = el.querySelector('.replybar input');
  const btn = el.querySelector('.replybar button');
  const doReply = () => {
    const t = input.value.trim();
    if (!t) return;
    appendMsg({ el, msgs }, { from: 'agent', text: t });
    input.value = '';
    fetch('/api/agent/reply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent_id: agentId, sid: m.session_id, text: t }),
    }).then(r => r.json()).then(j => {
      if (!j.ok) alert('发送失败：' + (j.error || '未知错误'));
    }).catch(() => alert('发送失败：网络异常'));
  };
  btn.addEventListener('click', doReply);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') doReply(); });
  return { el, msgs };
}

function appendMsg(card, h) {
  const d = document.createElement('div');
  if (h.from === 'system') d.className = 'm system';
  else if (h.from === 'agent') d.className = 'm agent';
  else d.className = 'm customer';
  d.textContent = h.text;
  card.msgs.appendChild(d);
  card.msgs.scrollTop = card.msgs.scrollHeight;
}

function addMessage(m) {
  let card = sessions.get(m.session_id);
  if (!card) {
    addCustomer({ session_id: m.session_id, name: m.session_id, history: [] });
    card = sessions.get(m.session_id);
  }
  appendMsg(card, { from: m.from, text: m.text });
}

function markOffline(m) {
  const card = sessions.get(m.session_id);
  if (!card) return;
  const status = card.el.querySelector('.status');
  status.textContent = '客户已下线';
  status.classList.add('offline');
  const tip = document.createElement('div');
  tip.className = 'offline-tip';
  tip.textContent = '客户已下线';
  card.msgs.appendChild(tip);
  const btn = card.el.querySelector('.replybar button');
  const input = card.el.querySelector('.replybar input');
  btn.disabled = true; input.disabled = true;
}

function handle(m) {
  switch (m.type) {
    case 'hello':
      document.getElementById('agentName').textContent = m.name;
      break;
    case 'customer_connected': addCustomer(m); break;
    case 'message': addMessage(m); break;
    case 'customer_offline': markOffline(m); break;
    case 'customer_list': (m.sessions || []).forEach(addCustomer); break;
  }
}

function init() {
  // 每个工作台标签 = 一个独立客服（sessionStorage 按标签隔离）
  agentId = sessionStorage.getItem('agent_id');
  if (!agentId) {
    agentId = 'A' + Math.random().toString(36).slice(2, 10);
    sessionStorage.setItem('agent_id', agentId);
  }
  const name = '客服-' + agentId.slice(1, 5);
  document.getElementById('agentName').textContent = name;
  const es = new EventSource('/api/agent/stream?agent_id=' + encodeURIComponent(agentId)
                             + '&name=' + encodeURIComponent(name));
  es.onopen = () => { conn.textContent = '在线'; conn.classList.add('on'); };
  es.onmessage = (ev) => handle(JSON.parse(ev.data));
  es.onerror = () => { conn.textContent = '重连中…'; conn.classList.remove('on'); };
}

init();
</script>
</body>
</html>
