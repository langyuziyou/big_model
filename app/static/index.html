<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服 - 简历问答</title>
<style>
  :root { --brand:#2563eb; --bg:#f1f5f9; --card:#fff; --text:#0f172a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Microsoft YaHei",-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text); height:100vh; display:flex; justify-content:center; align-items:center; }
  .app { width:460px; max-width:96vw; height:92vh; background:var(--card); border-radius:14px;
         box-shadow:0 10px 40px rgba(0,0,0,.12); display:flex; flex-direction:column; overflow:hidden; }
  header { background:var(--brand); color:#fff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .badge { font-size:12px; background:rgba(255,255,255,.2); padding:4px 10px; border-radius:999px; }
  .badge.manual { background:#f59e0b; color:#fff; }
  .chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:#fafbfc; }
  .msg { max-width:82%; padding:10px 13px; border-radius:12px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:3px; }
  .msg.bot { align-self:flex-start; background:#fff; border:1px solid #e5e7eb; border-bottom-left-radius:3px; }
  .msg.agent { align-self:flex-start; background:#fffbeb; border:1px solid #fcd34d; border-bottom-left-radius:3px; }
  .msg.system { align-self:center; background:#eef2ff; color:#475569; font-size:12px; padding:6px 12px; border-radius:999px; }
  .msg .src { display:block; font-size:11px; color:#94a3b8; margin-top:6px; }
  .inputbar { display:flex; gap:8px; padding:12px; border-top:1px solid #e5e7eb; background:#fff; }
  .inputbar input { flex:1; padding:11px 14px; border:1px solid #d1d5db; border-radius:10px; font-size:14px; outline:none; }
  .inputbar input:focus { border-color:var(--brand); }
  .inputbar button { padding:11px 18px; background:var(--brand); color:#fff; border:0; border-radius:10px; cursor:pointer; font-size:14px; }
  .modal-mask { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none;
                align-items:center; justify-content:center; z-index:50; }
  .modal-mask.show { display:flex; }
  .modal { background:#fff; border-radius:14px; padding:24px; width:360px; max-width:90vw; box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:center; }
  .modal h2 { font-size:16px; margin:0 0 10px; }
  .modal p { font-size:14px; color:#475569; margin:0 0 20px; }
  .modal .btns { display:flex; gap:10px; justify-content:center; }
  .modal button { padding:10px 26px; border-radius:10px; border:0; cursor:pointer; font-size:14px; }
  .btn-yes { background:var(--brand); color:#fff; }
  .btn-no { background:#e5e7eb; color:#334155; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>智能客服 · 简历问答</h1>
    <span id="badge" class="badge">智能助手在线</span>
  </header>
  <div id="chat" class="chat"></div>
  <div class="inputbar">
    <input id="input" type="text" placeholder="请输入你的问题…" autocomplete="off">
    <button id="send">发送</button>
  </div>
</div>

<div id="modal" class="modal-mask">
  <div class="modal">
    <h2>提示</h2>
    <p>我无法回答当前问题，是否切换到人工服务？</p>
    <div class="btns">
      <button class="btn-yes" id="btn-yes">是</button>
      <button class="btn-no" id="btn-no">否</button>
    </div>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const badge = document.getElementById('badge');
const modal = document.getElementById('modal');

let sid = null;
let manual = false;
let pendingQuestion = '';

function addMsg(text, who, src) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  if (src && src.length) {
    const s = document.createElement('span');
    s.className = 'src';
    s.textContent = '来源：' + src.join('、');
    d.appendChild(s);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function setBadge(txt, manualMode) {
  badge.textContent = txt;
  badge.classList.toggle('manual', !!manualMode);
}

function handle(m) {
  switch (m.type) {
    case 'answer':
      addMsg(m.answer, 'bot', m.sources);
      break;
    case 'need_manual':
      pendingQuestion = m.text || pendingQuestion;
      modal.classList.add('show');
      break;
    case 'manual_connected':
      manual = true;
      setBadge('人工服务中', true);
      addMsg('已接入人工客服' + (m.agent ? '（' + m.agent + '）' : '') + '，请描述你的问题', 'system');
      break;
    case 'manual_waiting':
      addMsg('当前暂无客服在线，请稍候…', 'system');
      break;
    case 'agent_reassigned':
      addMsg('已转接给客服' + (m.agent || '') + '，请继续', 'system');
      break;
    case 'agent_offline':
      addMsg('客服已离开，你仍在人工队列中', 'system');
      break;
    case 'message':
      addMsg(m.text, m.from === 'agent' ? 'agent' : 'user');
      break;
    case 'manual_ended':
      manual = false;
      setBadge('智能助手在线', false);
      addMsg('已结束人工服务，切回智能助手', 'system');
      break;
  }
}

async function init() {
  try {
    const r = await fetch('/api/customer/join', { method: 'POST' });
    const j = await r.json();
    sid = j.sid;
    const es = new EventSource('/api/customer/stream?sid=' + encodeURIComponent(sid));
    es.onmessage = (ev) => handle(JSON.parse(ev.data));
    addMsg('已连接客服系统，请输入你的问题', 'system');
  } catch (e) {
    addMsg('连接服务器失败，请确认服务已启动后刷新页面', 'system');
  }
}

function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
}

function sendMsg() {
  const text = input.value.trim();
  if (!text || !sid) return;
  addMsg(text, 'user');
  input.value = '';
  post('/api/customer/chat', { sid, text });
}

document.getElementById('send').addEventListener('click', sendMsg);
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

document.getElementById('btn-yes').addEventListener('click', () => {
  modal.classList.remove('show');
  post('/api/customer/switch_manual', { sid });
});

document.getElementById('btn-no').addEventListener('click', () => {
  modal.classList.remove('show');
});

init();
</script>
</body>
</html>
